name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q FigurineMaker.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        working-directory: FigurineMaker
        # сервер иногда не может скачать Gradle с первого раза — пробуем до 4 раз
        run: |
          chmod +x ./gradlew
          for i in 1 2 3 4; do
            ./gradlew assembleDebug --no-daemon && exit 0
            echo "Попытка $i не удалась, жду и пробую снова"
            sleep 30
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: Figurki3D-v1.${{ github.run_number }}
          path: FigurineMaker/app/build/outputs/apk/debug/*.apk
      # Релиз с APK: отсюда приложение на телефоне берёт обновления
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Фигурки 3D v1.${{ github.run_number }}
          files: FigurineMaker/app/build/outputs/apk/debug/*.apk
          make_latest: true
      # Копия APK в ветке «apk» — чтобы файл можно было забрать обычным git (без скачивания релизов)
      - name: Push APK to apk branch
        run: |
          mkdir apkout
          cp FigurineMaker/app/build/outputs/apk/debug/*.apk apkout/
          cd apkout
          git init -q
          git checkout -q -b apk
          git add .
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "APK v1.${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
