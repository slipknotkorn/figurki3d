name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q FigurineMaker.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        working-directory: FigurineMaker
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Figurki3D-v1.${{ github.run_number }}
          path: FigurineMaker/app/build/outputs/apk/debug/*.apk
      # Релиз с APK: отсюда приложение на телефоне берёт обновления
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Фигурки 3D v1.${{ github.run_number }}
          files: FigurineMaker/app/build/outputs/apk/debug/*.apk
          make_latest: true
